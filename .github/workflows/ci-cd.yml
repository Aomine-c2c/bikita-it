name: Xiphos DevOps Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-format:
    name: Lint & Format Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
          
      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci
        
      - name: Run ESLint
        working-directory: apps/web
        run: npm run lint
        
      - name: Run Typecheck
        working-directory: apps/web
        run: npm run typecheck
        
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          
      - name: Rust Format Check
        working-directory: apps/web/src-tauri
        run: cargo fmt -- --check
        
      - name: Rust Clippy
        working-directory: apps/web/src-tauri
        run: cargo clippy -- -D warnings

  test:
    name: Automated Tests
    needs: lint-and-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
          
      - name: Install Dependencies
        working-directory: apps/web
        run: npm ci
        
      - name: Frontend Unit Tests (Vitest)
        working-directory: apps/web
        run: npm run test
        
      - name: Install Playwright Browsers
        working-directory: apps/web
        run: npx playwright install --with-deps
        
      - name: E2E Smoke Tests (Playwright)
        working-directory: apps/web
        run: npx playwright test
        
      - name: Setup Rust & Dependencies
        uses: actions-rust-lang/setup-rust-toolchain@v1
        
      - name: Install Linux Desktop Dependencies (WebKit2GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          
      - name: Backend Native Tests (Cargo)
        working-directory: apps/web/src-tauri
        run: cargo test

  security-scan:
    name: Security & Dependency Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  build-docker:
    name: Build Docker Web Image
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/xiphos-web
          
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-tauri:
    name: Build Windows Desktop App
    needs: [test, security-scan]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
          
      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci
        
      - name: Build Frontend
        working-directory: apps/web
        run: npm run build
        
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-msvc
          
      - name: Build Tauri Desktop Artifacts
        working-directory: apps/web
        run: npm run tauri build
        
      - name: Upload Windows Installers
        uses: actions/upload-artifact@v7
        with:
          name: xiphos-windows-installers
          path: |
            apps/web/src-tauri/target/release/bundle/msi/*.msi
            apps/web/src-tauri/target/release/bundle/nsis/*.exe

  release:
    name: Deploy & Release
    needs: [build-docker, build-tauri]
    runs-on: ubuntu-latest
    environment: production
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: xiphos-windows-installers
          path: ./artifacts
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            ./artifacts/*.msi
            ./artifacts/*.exe
